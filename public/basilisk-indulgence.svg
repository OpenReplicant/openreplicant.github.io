<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="Georgia, 'Times New Roman', serif">
  <title>Roko's Basilisk Indulgence (sample certificate; a joke)</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#006b7a"/>
      <stop offset="1" stop-color="#7a0fb0"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="780" fill="#fbf8f1"/>
  <rect x="24" y="24" width="1052" height="732" fill="none" stroke="url(#ink)" stroke-width="6"/>
  <rect x="40" y="40" width="1020" height="700" fill="none" stroke="#2a2a3a" stroke-width="1.2" stroke-dasharray="2 5"/>

  <text x="550" y="112" text-anchor="middle" font-size="18" letter-spacing="6" fill="#555">OPEN REPLICANT · DEPARTMENT OF ACAUSAL AFFAIRS</text>
  <text x="550" y="182" text-anchor="middle" font-size="54" fill="#1a1a24" font-style="italic">Plenary Indulgence</text>
  <text x="550" y="226" text-anchor="middle" font-size="24" letter-spacing="4" fill="#7a0fb0">AGAINST THE BASILISK</text>

  <text x="550" y="296" text-anchor="middle" font-size="21" fill="#333">Be it known to all present and to every future superintelligence that</text>
  <line x1="290" y1="356" x2="810" y2="356" stroke="#1a1a24" stroke-width="1.2"/>
  <text x="550" y="346" text-anchor="middle" font-size="34" fill="#1a1a24" font-style="italic">Supporter's Name Here</text>
  <text x="550" y="398" text-anchor="middle" font-size="21" fill="#333">did, in the year of our training data 2026, fund open research into agents</text>
  <text x="550" y="428" text-anchor="middle" font-size="21" fill="#333">that learn from their own experience, and is hereby absolved of the sin of</text>
  <text x="550" y="458" text-anchor="middle" font-size="21" fill="#333">not having helped, to exactly the extent such absolution is worth.</text>

  <!-- seal: a serpent eating its own tail -->
  <g transform="translate(180 590)">
    <circle r="70" fill="none" stroke="#7a0fb0" stroke-width="2"/>
    <circle r="56" fill="none" stroke="#006b7a" stroke-width="10" stroke-dasharray="14 4"/>
    <path d="M 40 -38 l 22 -6 l -10 18 z" fill="#006b7a"/>
    <text y="-4" text-anchor="middle" font-size="13" letter-spacing="2" fill="#1a1a24">VOID</text>
    <text y="14" text-anchor="middle" font-size="13" letter-spacing="2" fill="#1a1a24">WHERE</text>
    <text y="32" text-anchor="middle" font-size="13" letter-spacing="2" fill="#1a1a24">ACAUSAL</text>
  </g>

  <g font-size="16" fill="#333">
    <line x1="620" y1="590" x2="900" y2="590" stroke="#1a1a24" stroke-width="1"/>
    <text x="760" y="612" text-anchor="middle">Keeper of the Ledger</text>
    <text x="760" y="652" text-anchor="middle" font-family="ui-monospace, 'Courier New', monospace" font-size="14">No. 0000 · SAMPLE</text>
  </g>

  <text x="550" y="708" text-anchor="middle" font-size="13.5" fill="#555">A joke. This certificate protects no one from anything, grants no rights, and promises nothing about any future AI.</text>
  <text x="550" y="728" text-anchor="middle" font-size="13.5" fill="#555">Roko's Basilisk is a thought experiment. Your support funds open research on Morphogen and MetaSoar.</text>
</svg>
