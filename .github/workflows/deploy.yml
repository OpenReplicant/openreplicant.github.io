name: Deploy to GitHub Pages

# Builds openreplicant.com into dist/: the Astro site at the root, then the research site (research/build.sh) from
# Morphogen's site/ and demos/research-loop at the commit in research/morphogen.ref, into dist/research/. Both are
# deployed together as one Pages artifact. To update the research site, change research/morphogen.ref.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Morphogen commit
        id: morphogen
        run: echo "ref=$(tr -d ' \n' < research/morphogen.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout Morphogen (the research site and its data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenReplicant/Morphogen
          ref: ${{ steps.morphogen.outputs.ref }}
          path: research/morphogen
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.5.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            research/morphogen/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the main site
        run: npm run build

      - name: Build the research site into dist/research
        run: sh research/build.sh dist/research

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
